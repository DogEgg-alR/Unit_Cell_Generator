<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晶胞生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --sidebar-bg: #ffffff;
            --text-color: #303133;
            --primary-color: #409eff;
            --selected-bg: #ecf5ff;
            --hover-bg: #f2f6fc;
            --input-bg: #f5f7fa;
            --border-color: #dcdfe6;
            --shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            --cell-line: #cc0000;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --sidebar-bg: #252526;
            --text-color: #e0e0e0;
            --primary-color: #409eff;
            --selected-bg: #3a3a3c;
            --hover-bg: #333333;
            --input-bg: #3c3c3c;
            --border-color: #444444;
            --shadow: 0 2px 12px 0 rgba(0,0,0,0.5);
            --cell-line: #ff5a5a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background-color 0.2s, color 0.2s;
        }

        .app-container { display: flex; width: 100%; height: 100%; }

        .sidebar {
            width: 380px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title { font-size: 18px; font-weight: bold; }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
        }

        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-color);
        }

        .canvas-container { flex: 1; position: relative; overflow: hidden; }

        .projection-container {
            position: relative;
            height: 300px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .projection-header {
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        select:focus, input:focus { border-color: var(--primary-color); }

        .btn {
            padding: 10px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary { background-color: var(--primary-color); color: white; width: 100%; }
        .btn-primary:hover { opacity: 0.9; }
        
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .btn-secondary:hover { background-color: var(--hover-bg); }

        .btn-small { padding: 4px 8px; font-size: 12px; }
        .btn-danger { background-color: #f56c6c; color: white; }
        .btn-danger:hover { background-color: #f78989; }

        .atom-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 30px; }
        .atom-tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background-color: var(--selected-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .atom-tag:hover { border-color: var(--primary-color); transform: translateY(-1px); }
        .atom-tag.active { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.2); }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .delete-atom { margin-left: 5px; color: #999; font-weight: bold; font-size: 14px; line-height: 1; }
        .delete-atom:hover { color: #f56c6c; }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 8px;
        }
        .toggle-label { font-size: 14px; font-weight: 500; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        .modal {
            background: var(--sidebar-bg); padding: 24px; border-radius: 8px;
            width: 90%; max-width: 450px; box-shadow: var(--shadow);
            color: var(--text-color);
            animation: modalFadeIn 0.3s ease;
            border: 1px solid var(--border-color);
        }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .modal-body { font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; }

        /* 原子坐标/信息浮板: 统一的字号, 3D 与投影共用一个样式, 避免"大小不均" */
        .info-panel {
            position: absolute; 
            background: var(--sidebar-bg); 
            border: 1px solid var(--border-color);
            padding: 8px 11px; 
            border-radius: 8px; 
            font-size: 13px; 
            line-height: 1.6;
            pointer-events: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            z-index: 50; 
            display: none; 
            max-width: 340px;
            white-space: normal;
            font-family: inherit;
            color: var(--text-color);
        }
        .info-panel .ip-head { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: var(--primary-color); display: flex; align-items: center; gap: 6px; }
        /* 坐标行不只在浮板里用, 模态框里也用同一套字号: 不加 .info-panel 前缀, 否则模态框内退回 14px 显得大小不均 */
        .ip-row { font-size: 13px; line-height: 1.7; }
        .ip-sub { font-size: 12px; opacity: 0.7; line-height: 1.6; }
        .ip-note { font-size: 13px; opacity: 0.8; margin-bottom: 10px; line-height: 1.6; }

        /* 投影视角标签: 代码放在按钮旁边的小徽章里, 不再由一排数字充当按钮 */
        .proj-view-code {
            font-size: 12px; font-family: monospace; opacity: 0.85;
            background: var(--hover-bg); padding: 3px 8px; border-radius: 4px;
            white-space: nowrap; border: 1px solid var(--border-color);
        }
        .chk-inline { font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }

        /* 投影视角按钮: 不换行、不被压扁 (窗口变窄时整行自动换到下一行) */
        .proj-btn { white-space: nowrap; flex-shrink: 0; }

        /* 对角面选择 (六种对角面) */
        .fdiag-select {
            font-size: 12px; padding: 4px 6px; border-radius: 4px; max-width: 190px;
            border: 1px solid var(--border-color); background: var(--sidebar-bg);
            color: var(--text-color); cursor: pointer;
        }

        /* 原子单选 (模态框里的"选择查看哪个原子") */
        .pick-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--hover-bg); transition: all 0.15s;
        }
        .pick-item:hover { border-color: var(--primary-color); background: var(--selected-bg); }
        .pick-item .pick-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.25); }
        .pick-item .pick-name { font-weight: bold; font-size: 14px; min-width: 38px; }
        .pick-item .pick-coord { font-size: 13px; opacity: 0.85; }
        .pick-item .pick-depth { margin-left: auto; font-size: 12px; color: var(--primary-color); white-space: nowrap; }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .main-view { height: 50%; }
            .projection-container { height: 40%; }
        }
        
        .theme-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .preset-btn { 
            height: 40px; border-radius: 6px; border: 2px solid transparent; 
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.2s;
        }
        .preset-btn:hover { transform: scale(1.05); }
        .preset-btn.active { border-color: var(--text-color); }
        .preset-name { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: rgba(0,0,0,0.6); color: white; 
            font-size: 10px; text-align: center; padding: 2px;
        }

        .color-edit-row {
            display: flex; align-items: center; gap: 10px; 
            margin-bottom: 12px; padding: 8px; 
            background: var(--hover-bg); border-radius: 6px;
        }
        .color-edit-label { width: 100px; font-size: 13px; font-weight: 500; }
        .color-edit-input { flex: 1; font-family: monospace; font-size: 12px; }
        .color-picker { width: 36px; height: 36px; border: none; border-radius: 4px; cursor: pointer; background: none; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">🔬 晶胞生成器</div>
            <button class="btn btn-secondary btn-small" id="themeSettingsBtn">🎨 主题设置</button>
        </div>
        
        <div class="sidebar-content">
            <div class="form-group">
                <label class="form-label">晶胞类型 / 形状</label>
                <select id="crystalType">
                    <option value="simple_cubic">简单立方 (Simple Cubic)</option>
                    <option value="bcc">体心立方 (BCC)</option>
                    <option value="fcc">面心立方 (FCC)</option>
                    <option value="nacl">氯化钠 (NaCl)</option>
                    <option value="cscl">氯化铯 (CsCl)</option>
                    <option value="diamond">金刚石 (Diamond)</option>
                    <option value="zinc_blende">闪锌矿 (ZnS)</option>
                    <option value="fluorite">萤石 (CaF₂)</option>
                    <option value="rutile">金红石 (TiO₂)</option>
                    <option value="perovskite">钙钛矿 (Perovskite)</option>
                    <option value="hcp">六方密堆积 (HCP)</option>
                    <option value="graphite">石墨 (Graphite)</option>
                    <option value="ice">冰 (Ice Ih)</option>
                    <option value="cu">金属铜 (Cu, 面心立方)</option>
                    <option value="fe">金属铁 (Fe, 体心立方)</option>
                    <option value="mg">金属镁 (Mg, 六方密堆积)</option>
                    <option value="sio2">二氧化硅 (SiO₂)</option>
                    <option value="triclinic">三斜晶系 (Triclinic)</option>
                    <option value="monoclinic">单斜晶系 (Monoclinic)</option>
                    <option value="orthorhombic">正交晶系 (Orthorhombic)</option>
                    <option value="custom">自定义分数坐标</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">晶胞参数 (支持字母 a,b,c)</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <input type="text" id="paramA" placeholder="a" value="a">
                        <select id="unitA" class="unit-select" style="margin-top:5px; padding:5px;"><option value="pm">pm</option><option value="A">Å</option><option value="nm" selected>nm</option><option value="um">µm</option><option value="cm">cm</option><option value="m">m</option></select>
                    </div>
                    <div>
                        <input type="text" id="paramB" placeholder="b (四方/六方自动=a)" value="b">
                        <select id="unitB" class="unit-select" style="margin-top:5px; padding:5px;"><option value="pm">pm</option><option value="A">Å</option><option value="nm" selected>nm</option><option value="um">µm</option><option value="cm">cm</option><option value="m">m</option></select>
                    </div>
                    <div>
                        <input type="text" id="paramC" placeholder="c" value="c">
                        <select id="unitC" class="unit-select" style="margin-top:5px; padding:5px;"><option value="pm">pm</option><option value="A">Å</option><option value="nm" selected>nm</option><option value="um">µm</option><option value="cm">cm</option><option value="m">m</option></select>
                    </div>
                    <div id="paramHexWrap" style="display:none;">
                        <input type="text" id="paramHex" placeholder="六边形棱长 a" value="a">
                        <div style="font-size:11px; opacity:0.6; margin-top:5px;">六边形棱长 (a)</div>
                    </div>
                </div>
                <div id="symmetryNote" style="display:none; font-size:11px; opacity:0.7; margin-top:8px; line-height:1.5;"></div>
                <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;" id="angleInputs">
                    <input type="number" id="angleAlpha" placeholder="α (deg)" value="90">
                    <input type="number" id="angleBeta" placeholder="β (deg)" value="90">
                    <input type="number" id="angleGamma" placeholder="γ (deg)" value="90">
                </div>
                <div id="angleHint" style="display:none; font-size:11px; line-height:1.5; margin-top:6px;"></div>
            </div>

            <div class="form-group" style="background: var(--hover-bg); padding: 12px; border-radius: 6px;">
                <label class="form-label" style="margin-bottom:12px;">显示模式控制</label>
                
                <div class="toggle-row">
                    <span class="toggle-label">3D视图 - 空间填充</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle3dFill" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="toggle-row" style="border-bottom: none; margin-bottom: 0;">
                    <span class="toggle-label">投影图 - 空间填充</span>
                    <label class="switch">
                        <input type="checkbox" id="toggleProjFill" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-row" style="margin-top: 8px; border-bottom:none; margin-bottom:0;">
                    <span class="toggle-label">3D 中显示投影面</span>
                    <label class="switch">
                        <input type="checkbox" id="togglePlane" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;">
                    <div>
                        <label style="font-size:11px; opacity:0.75;">投影面颜色</label>
                        <input type="color" id="planeColor" value="#3a86ff" style="width:100%; padding:2px; height:28px; border:1px solid var(--border-color); border-radius:4px; background:none;">
                    </div>
                    <div>
                        <label style="font-size:11px; opacity:0.75;">透明度 <span id="planeAlphaLabel">32%</span></label>
                        <input type="range" id="planeAlpha" min="8" max="80" value="32" style="width:100%;">
                    </div>
                </div>
                <div style="font-size:11px; opacity:0.65; margin-top:6px; line-height:1.5;">投影面与下方投影图视角保持一致，随晶胞一起转动。</div>
            </div>

            <div class="form-group" style="background: var(--hover-bg); padding: 12px; border-radius: 6px;">
                <label class="form-label" style="margin-bottom:12px;">坐标系设置 (xyz 轴可单独设置)</label>
                <div class="toggle-row" style="border-bottom:none; margin-bottom:4px;">
                    <span class="toggle-label">显示 xyz 坐标轴</span>
                    <label class="switch">
                        <input type="checkbox" id="toggleAxes" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div style="display:grid; grid-template-columns: 34px 1fr; gap:6px; align-items:center; margin-top:8px;">
                    <span style="color:#e06633; font-weight:bold; font-size:13px;">X 轴</span>
                    <select class="axis-dir" data-axis="x">
                        <option value="+a" selected>沿 x 轴 (+x)</option><option value="-a">沿 x 轴反向 (−x)</option>
                        <option value="+b">沿 y 轴 (+y)</option><option value="-b">沿 y 轴反向 (−y)</option>
                        <option value="+c">沿 z 轴 (+z)</option><option value="-c">沿 z 轴反向 (−z)</option>
                    </select>
                    <span style="color:#3aa757; font-weight:bold; font-size:13px;">Y 轴</span>
                    <select class="axis-dir" data-axis="y">
                        <option value="+a">沿 x 轴 (+x)</option><option value="-a">沿 x 轴反向 (−x)</option>
                        <option value="+b" selected>沿 y 轴 (+y)</option><option value="-b">沿 y 轴反向 (−y)</option>
                        <option value="+c">沿 z 轴 (+z)</option><option value="-c">沿 z 轴反向 (−z)</option>
                    </select>
                    <span style="color:#4a7fd4; font-weight:bold; font-size:13px;">Z 轴</span>
                    <select class="axis-dir" data-axis="z">
                        <option value="+a">沿 x 轴 (+x)</option><option value="-a">沿 x 轴反向 (−x)</option>
                        <option value="+b">沿 y 轴 (+y)</option><option value="-b">沿 y 轴反向 (−y)</option>
                        <option value="+c" selected>沿 z 轴 (+z)</option><option value="-c">沿 z 轴反向 (−z)</option>
                    </select>
                </div>
                <div style="font-size:12px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>坐标原点: <span id="originLabel" style="color:var(--primary-color); font-weight:bold;">晶胞顶点 (0,0,0)</span></span>
                    <button class="btn btn-secondary btn-small" id="resetOriginBtn">重置</button>
                </div>
                <div style="font-size:11px; opacity:0.65; margin-top:6px; line-height:1.5;">在"3D图交互操作"中选"设为坐标原点"后点击原子可更换原点；此后点击原子显示的坐标均基于该自定义坐标系。</div>
            </div>

            <div class="form-group">
                <label class="form-label">原子库 (点击添加到下方列表)</label>
                <div id="atomLibrary" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px;"></div>
                <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                    <input type="text" id="customAtomName" placeholder="自定义名称(如X)" style="flex:1">
                    <input type="color" id="customAtomColor" value="#ff0000" style="width:42px; padding:2px; border:1px solid var(--border-color); border-radius:4px;">
                    <button class="btn btn-secondary btn-small" id="addCustomAtom" style="width:42px;">+</button>
                </div>
                <label class="form-label" style="font-size:12px; margin-top:10px;">已添加原子 (点击选中):</label>
                <div class="atom-tags" id="activeAtomsList"></div>
            </div>

            <div class="form-group">
                <label class="form-label">快速添加位置 (当前选中: <span id="selectedAtomLabel" style="color:var(--primary-color); font-weight:bold;">无</span>)</label>
                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="vertex">顶点</button>
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="body">体心</button>
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="face">面心</button>
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="edge">棱心</button>
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="tetra">四面体空隙</button>
                    <button class="btn btn-secondary btn-small pos-btn" data-pos="octa">八面体空隙</button>
                </div>
                <div id="positionList" style="margin-top: 10px; font-size: 12px; max-height: 120px; overflow-y: auto; border:1px solid var(--border-color); border-radius:4px; padding:4px;"></div>
            </div>

            <div class="form-group">
                <label class="form-label">自定义分数坐标 (支持小数或分数如 1/4)</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="coordX" placeholder="x (如 0.25 或 1/4)" style="width: 80px">
                    <input type="text" id="coordY" placeholder="y" style="width: 80px">
                    <input type="text" id="coordZ" placeholder="z" style="width: 80px">
                    <button class="btn btn-primary btn-small" id="addCoordBtn" style="width:auto;">添加</button>
                </div>
                <div style="margin-top: 8px;">
                    <label style="font-size: 12px; display:flex; align-items:center; gap:6px; cursor:pointer;">

<script>
const state = {

    originIndex: -1,
    theme: 'light',
    crystalType: 'simple_cubic',

    selectedAtomForAdd: null,
    interactionMode: 'view',
    is3dSpaceFilling: true,
    isProjSpaceFilling: true,
    showProjOutside: true,
    showProjectionPlane: true,

    plane: { show: true, color: '#3a86ff', alpha: 0.32 },
    axes: { show: true, xDir: '+a', yDir: '+b', zDir: '+c', origin: null }
};

// 晶胞的"参考棱长"(Å), 用来把原子半径(Å)换算成占晶胞边长的比例。
// 用户在左栏可以只写字母 a/b/c(这时晶胞在场景里是 1 个单位长), 也可以写真实数字+单位。
// 无论哪种, 原子半径都必须按"真实晶胞里原子半径/晶胞棱长"的比例来画,
// 否则会出现整屏一个球(半径 0.7 个晶胞) 或投影里只有几个点。
const REF_LATTICE_ANGSTROM = {
    simple_cubic: 3.50, bcc: 2.87, fcc: 3.61, nacl: 5.64, cscl: 4.12,
    diamond: 3.57, zinc_blende: 5.41, fluorite: 5.46, perovskite: 3.90,
    sio2: 7.16, rutile: 4.20, hcp: 3.21, co2: 5.62, ice: 4.52,
    graphite: 2.46, cu: 3.61, fe: 2.87, mg: 3.21,
    triclinic: 5.00, monoclinic: 5.00, orthorhombic: 5.00, custom: 4.00
};
// 长度单位 → Å
const UNIT_TO_ANGSTROM = { pm: 0.01, A: 1, nm: 10, um: 10000, cm: 1e8, m: 1e10 };

const ATOM_DB = {
    'H': {c:'#FFFFFF', r:0.3}, 'He': {c:'#D9FFFF', r:0.3}, 'Li': {c:'#CC80FF', r:1.5}, 
    'Be': {c:'#C2FF00', r:1.1}, 'B': {c:'#FFB5B5', r:0.9}, 'C': {c:'#909090', r:0.7}, 
    'N': {c:'#3050F8', r:0.7}, 'O': {c:'#FF0D0D', r:0.6}, 'F': {c:'#90E050', r:0.6}, 
    'Na': {c:'#AB5CF2', r:1.8}, 'Mg': {c:'#8AFF00', r:1.5}, 'Al': {c:'#BFA6A6', r:1.3}, 
    'Si': {c:'#F0C8A0', r:1.1}, 'P': {c:'#FF8000', r:1.0}, 'S': {c:'#FFFF30', r:1.0}, 
    'Cl': {c:'#1FF01F', r:1.0}, 'K': {c:'#8F40D4', r:2.2}, 'Ca': {c:'#3DFF00', r:1.9}, 
    'Ti': {c:'#BFC2C7', r:1.4}, 'Fe': {c:'#E06633', r:1.3}, 'Cu': {c:'#C88033', r:1.3}, 
    'Zn': {c:'#7D80B0', r:1.3}, 'Br': {c:'#A62929', r:1.1}, 'I': {c:'#940094', r:1.3}, 
    'Cs': {c:'#57178F', r:2.6}
};

// 修正后的预设数据
const PRESETS = {
    'simple_cubic': { shape:'cubic', atoms:[{n:'A', p:[[0,0,0]]}] },
    'bcc': { shape:'cubic', atoms:[{n:'A', p:[[0,0,0],[0.5,0.5,0.5]]}] },
    'fcc': { shape:'cubic', atoms:[{n:'A', p:[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]]}] },
    'nacl': { shape:'cubic', atoms:[
        {n:'Na', p:[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]]},

    // 金刚石：标准 Fd-3m 结构
    'diamond': { shape:'cubic', atoms:[{n:'C', p:[
        [0,0,0], [0.5,0.5,0], [0.5,0,0.5], [0,0.5,0.5], 
        [0.25,0.25,0.25], [0.75,0.75,0.25], [0.75,0.25,0.75], [0.25,0.75,0.75]

    'zinc_blende': { shape:'cubic', atoms:[
        {n:'Zn', p:[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]]},

    ]},
    'fluorite': { shape:'cubic', atoms:[
        {n:'Ca', p:[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]]},

        ]}
    ]},
    
    // 金红石 (TiO2)：四方晶系
    'rutile': { shape:'tetragonal', atoms:[
        {n:'Ti', p:[[0,0,0],[0.5,0.5,0.5]]},

    ]},
    'hcp': { shape:'hexagonal', atoms:[{n:'A', p:[[0,0,0],[1/3,1/3,0.5]]}] },

    // ---- 组卷网/教材里最常见的几种, 按考法补进来 ----
    // 石墨: 六方层状, 层内 C-C = a/√3 (1.42 Å), 层间距 c/2, AB 堆垛
    'graphite': { shape:'hexagonal', atoms:[{n:'C', p:[
        [0,0,0], [1/3,1/3,0],
        [1/3,1/3,0.5], [2/3,2/3,0.5]
    ]}] },
    // 冰 (冰 Ih 的氧原子骨架): 六方, 每个 O 与 4 个 O 以氢键相连 (O-O ≈ 2.76 Å)
    'ice': { shape:'hexagonal', atoms:[{n:'O', p:[
        [0,0,0], [0,0,0.375],
        [1/3,1/3,0.5], [1/3,1/3,0.875]
    ]}] },
    // 金属铜: 面心立方
    'cu': { shape:'cubic', atoms:[{n:'Cu', p:[[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]]}] },
    // 金属铁: 体心立方 (α-Fe)
    'fe': { shape:'cubic', atoms:[{n:'Fe', p:[[0,0,0],[0.5,0.5,0.5]]}] },
    // 金属镁: 六方最密堆积
    'mg': { shape:'hexagonal', atoms:[{n:'Mg', p:[[0,0,0],[1/3,1/3,0.5]]}] },
    
    // 二氧化硅 (β-方石英)：立方晶胞，Si 占金刚石位置，O 位于每条 Si-Si 键中点（16 个）
    'sio2': { shape:'cubic', bondCut: 0.72, atoms: (function(){
        const Si = [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5],[0.25,0.25,0.25],[0.75,0.75,0.25],[0.75,0.25,0.75],[0.25,0.75,0.75]];
        const target = Math.sqrt(3)/4; // 金刚石结构最近邻 Si-Si 距离
        const O = [], seen = new Set();
        Si.forEach((s1, i) => {
            Si.forEach((s2, j) => {
                if(i === j) return;
                for(let dx=-1; dx<=1; dx++) for(let dy=-1; dy<=1; dy++) for(let dz=-1; dz<=1; dz++) {
                    const p = [s2[0]+dx, s2[1]+dy, s2[2]+dz];
                    const d = Math.sqrt((p[0]-s1[0])**2 + (p[1]-s1[1])**2 + (p[2]-s1[2])**2);
                    if(Math.abs(d - target) < 0.01) {
                        const m = [ ((s1[0]+p[0])/2 % 1 + 1) % 1, ((s1[1]+p[1])/2 % 1 + 1) % 1, ((s1[2]+p[2])/2 % 1 + 1) % 1 ];
                        const k = m.map(v=>v.toFixed(4)).join(',');
                        if(!seen.has(k)) { seen.add(k); O.push(m); }
                    }
                }
            });
        });
        return [{n:'Si', p:Si}, {n:'O', p:O}];
    })() },

    'triclinic': { shape:'triclinic', atoms:[{n:'A', p:[[0,0,0]]}] },
    // 单斜晶系示例 (β ≈ 99°，高中/大学结构化学常见的变形立方)
    'monoclinic': { shape:'monoclinic', atoms:[{n:'A', p:[[0,0,0]]}] },
    // 正交晶系示例 (a ≠ b ≠ c)
    'orthorhombic': { shape:'orthorhombic', atoms:[{n:'A', p:[[0,0,0]]}] }
};

function setupEventListeners() {
    document.getElementById('crystalType').addEventListener('change', (e) => {
        state.crystalType = e.target.value;
        if(PRESETS[state.crystalType]) loadPreset(state.crystalType);
        updateCellParamUI();
        // 切换类型后立即自动重建 3D 图，避免显示旧结构
        generateCrystal();
    });

    document.getElementById('addCustomAtom').addEventListener('click', () => {
        const name = document.getElementById('customAtomName').value.trim();
        const color = document.getElementById('customAtomColor').value;
        if(!name) return showModal('错误', '请输入原子名称');
        if(state.atoms[name]) return showModal('错误', '该原子已存在');
        state.atoms[name] = { color: color, radius: 1.0, custom: true };
        renderActiveAtoms();
        updateReplaceSelect();
        selectAtom(name);
        document.getElementById('customAtomName').value = '';
    });

    document.querySelectorAll('.pos-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if(!state.selectedAtomForAdd) return showModal('提示', '请先在上方原子库中点击选择一个原子');
            addPositionByType(btn.dataset.pos);
            scheduleRegen();
        });
    });

    document.getElementById('addCoordBtn').addEventListener('click', () => {
        if(!state.selectedAtomForAdd) return showModal('提示', '请先选择原子');
        
        const xStr = document.getElementById('coordX').value.trim();
        const yStr = document.getElementById('coordY').value.trim();
        const zStr = document.getElementById('coordZ').value.trim();
        
        const x = parseFraction(xStr);
        const y = parseFraction(yStr);
        const z = parseFraction(zStr);
        
        if(isNaN(x) || isNaN(y) || isNaN(z)) return showModal('错误', '请输入有效数字或分数 (如 1/4)');
        
        state.positions.push({ atom: state.selectedAtomForAdd, frac: [x,y,z], type: 'custom' });
        updatePositionList();
        scheduleRegen();
        
        document.getElementById('coordX').value = '';
        document.getElementById('coordY').value = '';
        document.getElementById('coordZ').value = '';
    });

    document.getElementById('generateBtn').addEventListener('click', generateCrystal);
    
    document.getElementById('resetBtn').addEventListener('click', () => {
        showModal('确认重置', '确定要重置所有设置吗？这将清除所有自定义原子、位置和持久化修改。', () => {
            location.reload();
        });
    });

    document.getElementById('interactionMode').addEventListener('change', (e) => {
        state.interactionMode = e.target.value;

function parseFraction(str) {
    if (!str) return NaN;
    str = String(str).replace(/\s/g, ''); 
    if (str.includes('/')) {
        const parts = str.split('/');
        if (parts.length === 2) {
            const num = parseFloat(parts[0]);
            const den = parseFloat(parts[1]);
            if (!isNaN(num) && !isNaN(den) && den !== 0) return num / den;
        }
        return NaN;
    }
    return parseFloat(str);
}

// ===== 晶系约束 (三斜/单斜/正交/四方/六方/立方) =====
// 每种晶胞类型属于哪一晶系、哪些参数与角度被晶系约束, 统一在这里管理
const CELL_SYSTEMS = {
    cubic:     { label: '立方晶系',     constraint: 'a = b = c，α = β = γ = 90°', free: [],                  symLabel: '立方晶系', symOps: 'CUBIC_OPS' },
    tetragonal:{ label: '四方晶系',     constraint: 'a = b ≠ c，α = β = γ = 90°', free: ['c'],               symLabel: '四方晶系', symOps: 'TETRA_OPS' },
    hexagonal: { label: '六方晶系',     constraint: 'a = b ≠ c，α = β = 90°，γ = 120°（六棱柱）', free: ['c'], symLabel: '六方晶系', symOps: 'HEX_OPS' },
    orthorhombic:{ label: '正交晶系',   constraint: 'a ≠ b ≠ c，α = β = γ = 90°', free: ['a','b','c'],        symLabel: '正交晶系', symOps: 'ORTHO_OPS' },
    monoclinic:{ label: '单斜晶系',     constraint: 'a ≠ b ≠ c，β ≠ 90°，α = γ = 90°', free: ['a','b','c'], symLabel: '单斜晶系', symOps: 'MONO_OPS' },
    triclinic: { label: '三斜晶系',     constraint: 'a ≠ b ≠ c，α ≠ β ≠ γ ≠ 90°（无约束）', free: ['a','b','c'], symLabel: '三斜晶系', symOps: 'TRICLINIC_OPS' }
};

const CELL_TYPE_SYSTEM = {
    simple_cubic:'cubic', bcc:'cubic', fcc:'cubic', nacl:'cubic', cscl:'cubic',
    diamond:'cubic', zinc_blende:'cubic', fluorite:'cubic', perovskite:'cubic', sio2:'cubic', custom:'cubic',
    rutile:'tetragonal',
    hcp:'hexagonal',
    graphite:'hexagonal', ice:'hexagonal', mg:'hexagonal',
    cu:'cubic', fe:'cubic',
    triclinic:'triclinic',
    monoclinic:'monoclinic',
    orthorhombic:'orthorhombic'
};

// 六方结构的理想 c/a (输入框留空/写字母时用): 石墨层间距远大于棱长, 冰/镁接近理想值
const HEX_C_OVER_A = { graphite: 2.73, ice: 1.628, hcp: 1.633, mg: 1.624 };

function cellSystemOf(type) {
    return CELL_SYSTEMS[CELL_TYPE_SYSTEM[type]] || CELL_SYSTEMS.cubic;
}

// 角度合法性: 三斜/单斜等必须满足 Gram 行列式 > 0, 否则三根轴画不出合法晶胞
function anglesLegal(alpha, beta, gamma) {
    const ca = Math.cos(alpha*Math.PI/180), cb = Math.cos(beta*Math.PI/180), cg = Math.cos(gamma*Math.PI/180);
    return (1 - ca*ca - cb*cb - cg*cg + 2*ca*cb*cg) > 1e-6;
}

// 角度输入框下面的动态提示 (只在三斜/单斜等真正可变角时显示)
function updateAngleHint() {
    const sysKey = CELL_TYPE_SYSTEM[state.crystalType] || 'cubic';
    const el = document.getElementById('angleHint');
    const a = parseFloat(document.getElementById('angleAlpha').value);
    const b = parseFloat(document.getElementById('angleBeta').value);
    const c = parseFloat(document.getElementById('angleGamma').value);

    if(sysKey !== 'triclinic' && sysKey !== 'monoclinic') {
        el.style.display = 'none';
        return;
    }
    el.style.display = 'block';
    if(!anglesLegal(a, b, c)) {
        el.style.color = '#e05252';
        el.innerHTML = `⚠ 当前角度组合 (α=${a}°, β=${b}°, γ=${c}°) 无法构成合法晶胞 (Gram 行列式 ≤ 0)，坐标轴长度会退化为 0。请调整角度，例如 β 在 20°–160° 之间。`;
    } else {
        el.style.color = 'var(--primary-color)';
        el.innerHTML = sysKey === 'monoclinic'
            ? `单斜: a ≠ b ≠ c，β ≠ 90°（α = γ = 90°），β = ${b}°`
            : `三斜: a ≠ b ≠ c，α = ${a}°，β = ${b}°，γ = ${c}°，全部可变`;
    }
}

// 切换晶胞类型时刷新参数输入区的可用状态 (哪些被晶系约束锁定)
let lastParamSys = null;   // 上一次的晶系, 用于判断"刚切过来"从而填默认角度
function updateCellParamUI() {
    const sysKey = CELL_TYPE_SYSTEM[state.crystalType] || 'cubic';
    const sys = CELL_SYSTEMS[sysKey];
    const type = state.crystalType;
    const isHex = (sysKey === 'hexagonal');
    const isFree = (k) => sys.free.includes(k);

    // 六棱柱: b 固定等于六边形棱长, c 为高度
    document.getElementById('paramHexWrap').style.display = isHex ? 'block' : 'none';

    const setField = (id, enabled) => {
        const el = document.getElementById(id);
        el.disabled = !enabled;
        el.style.opacity = enabled ? '1' : '0.55';
        el.style.cursor = enabled ? 'text' : 'not-allowed';
    };
    setField('paramA', isFree('a'));
    setField('paramB', isFree('b'));
    setField('paramC', isFree('c'));

    // 角度: 只有三斜(全部)与单斜(仅 β)可改
    const angEnabled = { alpha: sysKey === 'triclinic', beta: (sysKey === 'triclinic' || sysKey === 'monoclinic'), gamma: sysKey === 'triclinic' };
    const setAngle = (id, enabled, val) => {
        const el = document.getElementById(id);
        el.disabled = !enabled;
        el.style.opacity = enabled ? '1' : '0.55';
        el.value = val;
    };
    const keep = (id, def) => {
        const el = document.getElementById(id);
        return el.disabled ? def : el.value;
    };
    // 进入三斜/单斜时给一组"非 90°"的默认角度:
    // 若沿用上一次的 90/90/90, 三斜晶胞画出来和立方一模一样, 用户会以为没生效
    const switched = (lastParamSys !== sysKey);
    if(switched) {
        if(sysKey === 'triclinic') {
            setAngle('angleAlpha', true, 80);
            setAngle('angleBeta', true, 75);
            setAngle('angleGamma', true, 70);
        } else if(sysKey === 'monoclinic') {
            setAngle('angleAlpha', false, 90);
            setAngle('angleBeta', true, 99);
            setAngle('angleGamma', false, 90);
        } else {
            setAngle('angleAlpha', false, 90);
            setAngle('angleBeta', false, 90);
            setAngle('angleGamma', false, 90);
        }
    } else {
        setAngle('angleAlpha', angEnabled.alpha, parseFloat(keep('angleAlpha', 90)) || 90);
        setAngle('angleBeta', angEnabled.beta, parseFloat(keep('angleBeta', 90)) || 90);
        setAngle('angleGamma', angEnabled.gamma, parseFloat(keep('angleGamma', 90)) || 90);
    }
    lastParamSys = sysKey;
    document.getElementById('angleInputs').style.opacity = '1';

    // 晶系说明
    const note = document.getElementById('symmetryNote');
    note.style.display = 'block';
    note.innerHTML = `<b>${sys.label}</b>：${sys.constraint}`;

    // 对称性勾选框的文案随晶系切换 (三斜没有可扩展的等效点, 直接禁用)
    const sym = document.getElementById('applySymmetry');
    const symLabel = document.getElementById('applySymmetryLabel');
    if(sysKey === 'triclinic') {
        sym.checked = false;
        sym.disabled = true;
        symLabel.innerText = '三斜晶系：无对称操作，每个分数坐标只生成 1 个原子';
        symLabel.style.opacity = '0.55';
    } else {
        sym.disabled = false;
        symLabel.innerText = `应用${sys.symLabel}对称性 (生成等效点系，分数坐标只输入一个)`;
        symLabel.style.opacity = '1';
    }

    updateAngleHint();
}

// 防抖自动重算：改输入后 600ms 自动重建晶胞，不打断输入
let _regenTimer = null;
function scheduleRegen() {
    clearTimeout(_regenTimer);
    _regenTimer = setTimeout(() => generateCrystal(), 600);
}

// 把晶胞分数坐标换算到用户自定义坐标系 (原点 + xyz 各自方向)
function userFrameCoord(frac) {
    const ax = state.axes;
    const o = ax.origin || [0, 0, 0];
    const d = [frac[0] - o[0], frac[1] - o[1], frac[2] - o[2]];
    const idxMap = { a: 0, b: 1, c: 2 };
    const comp = (s) => {
        const sign = (s || '').trim().startsWith('-') ? -1 : 1;
        const letter = (s || '').replace(/[^abc]/g, '');
        return sign * d[(idxMap[letter] !== undefined) ? idxMap[letter] : 0];
    };
    return [comp(ax.xDir), comp(ax.yDir), comp(ax.zDir)];
}

// 生成坐标轴末端文字标签 (x/y/z) 的精灵图
function makeAxisLabel(text, color, size) {
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    const c2 = cv.getContext('2d');
    c2.font = 'bold 46px sans-serif';
    c2.fillStyle = color;
    c2.textAlign = 'center';
    c2.textBaseline = 'middle';
    c2.fillText(text, 32, 34);
    const tex = new THREE.CanvasTexture(cv);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
    const s = size || 0.32;   // 字母大小随晶胞尺寸缩放, 否则大晶胞里字太小 / 小晶胞里字糊满屏\n    sp.scale.set(s, s, 1);
    return sp;
}

        const lbl = document.createElement('div');
        lbl.className = 'color-edit-label';
        lbl.innerText = label;
        
        const colorInp = document.createElement('input');
        colorInp.type = 'color'; 
        colorInp.className = 'color-picker';
        colorInp.dataset.var = cssVar;
        colorInp.value = currentThemeConfig[cssVar];
        
        const hexInp = document.createElement('input');
        hexInp.type = 'text'; 
        hexInp.className = 'color-edit-input';
        hexInp.value = currentThemeConfig[cssVar];

        const updateTheme = (newVal) => {
            if(/^#[0-9A-F]{6}$/i.test(newVal)) {
                currentThemeConfig[cssVar] = newVal;
                applyThemeVars(currentThemeConfig);
                colorInp.value = newVal;
                hexInp.value = newVal;
            }
        };
        
        colorInp.addEventListener('input', (e) => updateTheme(e.target.value));
        hexInp.addEventListener('change', (e) => updateTheme(e.target.value));
        hexInp.addEventListener('blur', (e) => {
            let val = e.target.value;
            if(!val.startsWith('#')) val = '#' + val;
            updateTheme(val);
        });

        row.appendChild(lbl);
        row.appendChild(colorInp);
        row.appendChild(hexInp);

    footer.innerHTML = '';

function refreshColorInputs() {

        if(picker && hex) {

            picker.value = v;
            hex.value = v;
        }
    });
}

// 统一模态框: 提示 / 确认 / 多选都走这里 (msg 可以是文本, 也可以是 HTML 字符串)
function showModal(title, msg, onConfirm = null) {
    // 所有提示统一走 _openModal: 它自己生成按钮, 不再依赖页面上固定的 #modalConfirm
    // (那个按钮在第一次 _openModal 重写 footer 时就被移除了, cloneNode 会拿到 null)
    _openModal(title, msg, [{ text: '确定', primary: true, onClick: onConfirm || null }]);
}

function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
}

// 通用弹窗: buttons 为 [{text, primary, onClick}]; 点击遮罩/Esc 关闭
function _openModal(title, bodyHTML, buttons) {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').innerText = title;
    const body = document.getElementById('modalBody');
    body.innerHTML = bodyHTML;
    const footer = document.getElementById('modalFooter');
    footer.innerHTML = '';
    (buttons || []).forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn btn-small ' + (b.primary ? 'btn-primary' : 'btn-secondary');
        el.innerText = b.text;
        el.onclick = () => { closeModal(); if(b.onClick) b.onClick(); };
        footer.appendChild(el);
    });
    overlay.style.display = 'flex';
    return body;
}
document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
});
document.addEventListener('click', (e) => {
    if(e.target && e.target.id === 'modalOverlay') closeModal();
});

function initAtomLibrary() {
    const container = document.getElementById('atomLibrary');
    container.innerHTML = '';
    for(let sym in ATOM_DB) {
        const btn = document.createElement('div');
        btn.className = 'atom-tag';
        btn.innerHTML = `<span class="color-dot" style="background:${ATOM_DB[sym].c}"></span>${sym}`;
        btn.onclick = () => addToActiveAtoms(sym);
        container.appendChild(btn);
    }
}

function addToActiveAtoms(name) {
    if(!state.atoms[name]) {
        const dbData = ATOM_DB[name] || {c:'#888', r:1.0};
        state.atoms[name] = { color: dbData.c, radius: dbData.r };
    }
    renderActiveAtoms();
    updateReplaceSelect();
    selectAtom(name);
}

function selectAtom(name) {
    state.selectedAtomForAdd = name;
    document.getElementById('selectedAtomLabel').innerText = name;
    
    document.querySelectorAll('#activeAtomsList .atom-tag').forEach(t => t.classList.remove('active'));
    const tags = Array.from(document.querySelectorAll('#activeAtomsList .atom-tag'));
    const target = tags.find(t => t.innerText.startsWith(name + ' '));
    if(target) target.classList.add('active');
}

function renderActiveAtoms() {
    const list = document.getElementById('activeAtomsList');
    list.innerHTML = '';
    for(let name in state.atoms) {
        const tag = document.createElement('div');
        tag.className = 'atom-tag';
        if(state.selectedAtomForAdd === name) tag.classList.add('active');
        tag.innerHTML = `${name} <span class="color-dot" style="background:${state.atoms[name].color}"></span> <span class="delete-atom">×</span>`;
        
        tag.onclick = (e) => {
            if(!e.target.classList.contains('delete-atom')) {
                selectAtom(name);
            }
        };
        
        tag.querySelector('.delete-atom').onclick = (e) => {
            e.stopPropagation();
            showModal('确认删除', `确定要从原子库中删除 ${name} 吗？相关位置也会被移除。`, () => {
                delete state.atoms[name];
                state.positions = state.positions.filter(p => p.atom !== name);
                if(state.selectedAtomForAdd === name) {
                    state.selectedAtomForAdd = null;
                    document.getElementById('selectedAtomLabel').innerText = '无';
                }
                renderActiveAtoms();
                updatePositionList();
                scheduleRegen();
            });
        };
        
        list.appendChild(tag);
    }
    updateReplaceSelect();
}

function updateReplaceSelect() {
    const sel = document.getElementById('replaceTargetSelect');
    // 重建下拉框时必须保留用户已选的目标原子,
    // 否则任何一次原子库刷新都会把它悄悄重置成第一项(通常是 A), 于是点谁都是"原本就是 A"
    const prev = sel.value;
    sel.innerHTML = '';
    for(let name in state.atoms) {
        const opt = document.createElement('option');
        opt.value = name; opt.innerText = name;
        sel.appendChild(opt);
    }
    if(prev && state.atoms[prev]) sel.value = prev;
}

function loadPreset(key) {
    const p = PRESETS[key];
    if(!p) return;
    state.atoms = {};
    state.positions = [];
    state.persistentModifications = {};
    // 原子列表重建后旧原点索引失效, 重置坐标系原点
    state.axes.origin = null;
    state.originIndex = -1;
    document.getElementById('originLabel').innerText = '晶胞顶点 (0,0,0)';
    
    p.atoms.forEach(group => {
        if(!state.atoms[group.n]) {
            const dbData = ATOM_DB[group.n] || {c:'#888', r:1.0};
            state.atoms[group.n] = { color: dbData.c, radius: dbData.r };
        }
        group.p.forEach(frac => {
            state.positions.push({ atom: group.n, frac: frac, type: 'preset' });
        });
    });
    renderActiveAtoms();
    updatePositionList();
}

function addPositionByType(type) {
    const atom = state.selectedAtomForAdd;
    const coords = [];
    switch(type) {
        case 'vertex': coords.push([0,0,0]); break;
        case 'body': coords.push([0.5,0.5,0.5]); break;
        case 'face': coords.push([0.5,0.5,0], [0.5,0,0.5], [0,0.5,0.5]); break;
        case 'edge': coords.push([0.5,0,0], [0,0.5,0], [0,0,0.5]); break;
        case 'tetra': coords.push([0.25,0.25,0.25], [0.75,0.75,0.25], [0.75,0.25,0.75], [0.25,0.75,0.75]); break;
        case 'octa': coords.push([0.5,0,0], [0,0.5,0], [0,0,0.5], [0.5,0.5,0.5]); break;
    }
    coords.forEach(c => state.positions.push({atom, frac:c, type}));
    updatePositionList();
}

function updatePositionList() {
    const div = document.getElementById('positionList');
    div.innerHTML = state.positions.map((p, i) => 
        `<div style="padding:4px 6px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
            <span><strong>${p.atom}</strong>: (${p.frac.map(x=>x.toFixed(2)).join(',')})</span>
            <button class="btn btn-small btn-danger" onclick="removePos(${i})" style="padding:2px 6px;">×</button>
         </div>`
    ).join('');
}

window.removePos = function(i) {
    state.positions.splice(i, 1);
    updatePositionList();
    scheduleRegen();
}
